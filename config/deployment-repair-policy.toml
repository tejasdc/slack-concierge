version = 1
target = "concierge"

[autonomous]
existing_source = [
  "bot/scripts/deploy-state.ts",
  "bot/src/deployment-state.ts",
  "bot/src/deployment-worker.ts",
]
source_prefixes = [
  "deployment-control/coordinator/",
  "bot/src/deployment-repair/",
  "bot/scripts/deployment-repair/",
]
tests = [
  "bot/tests/deploy.test.ts",
  "bot/tests/deployment-state.test.ts",
]
test_prefixes = ["bot/tests/deployment-repair/"]
required_docs = [
  "docs/architecture/DEPLOYMENT-REPAIR.md",
  "docs/runbooks/DEPLOYMENT.md",
]

[protected]
exact = [
  "config/deployment-repair-policy.toml",
  "bot/scripts/deploy.sh",
  "AGENTS.md",
  "bot/package.json",
  "bot/bun.lock",
  "slack-app-manifest.json",
]
prefixes = [
  "deployment-control/kernel/",
  "bot/src/providers.ts",
  "bot/src/codex",
  "bot/src/claude",
  "bot/src/slack",
  "bot/src/capture",
  "config/capture",
  "systemd/",
]

[limits]
maximum_changed_files = 24
maximum_patch_bytes = 262144
require_focused_test = true
require_current_state_documentation = true
require_independent_ship = true
require_unchanged_origin_base = true
