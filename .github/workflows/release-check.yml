name: Concierge release check

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CONCIERGE_CHECK_BUN_VERSION: 1.4.2

jobs:
  select-check-groups:
    name: Select check groups
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.groups.outputs.matrix }}
      source: ${{ steps.groups.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.CONCIERGE_CHECK_BUN_VERSION }}
      - id: groups
        working-directory: bot
        shell: bash
        run: |
          echo "matrix=$(bun run scripts/run-release-checks.ts --matrix)" >> "$GITHUB_OUTPUT"
          echo "source=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  check-group:
    name: Check ${{ matrix.group }}
    needs: select-check-groups
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-check-groups.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select-check-groups.outputs.source }}
          fetch-depth: 0
      - name: Bind checks to the selected source
        env:
          CHECKED_SOURCE: ${{ needs.select-check-groups.outputs.source }}
        run: test "$(git rev-parse HEAD)" = "$CHECKED_SOURCE"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.CONCIERGE_CHECK_BUN_VERSION }}
      - name: Every fix names its failure record
        run: bun bot/scripts/failure-record-check.ts range origin/main..HEAD
      - name: Install frozen dependencies
        working-directory: bot
        run: bun install --frozen-lockfile
      - name: Select the host GNU timeout dependency
        shell: bash
        run: |
          concierge_timeout=$(command -v gnutimeout || command -v timeout)
          concierge_timeout_version=$("$concierge_timeout" --version)
          printf '%s\n' "$concierge_timeout_version"
          [[ "$concierge_timeout_version" == *"(GNU coreutils)"* ]]
          mkdir -p "$RUNNER_TEMP/concierge-native-bin"
          ln -s "$concierge_timeout" "$RUNNER_TEMP/concierge-native-bin/timeout"
          echo "$RUNNER_TEMP/concierge-native-bin" >> "$GITHUB_PATH"
      - name: Install native check dependencies
        run: |
          sudo apt-get update -qq
          # No bubblewrap: the hosted runner cannot create nested namespaces, so isolation-dependent
          # checks belong to the native group run on the AX41 candidate gate (release-checks.json).
          sudo apt-get install -y restic
      - name: Run the complete bounded check group
        working-directory: bot
        env:
          CONCIERGE_STATE_DIR: ${{ runner.temp }}/concierge-release-check
          CHECK_GROUP: ${{ matrix.group }}
        run: bun run scripts/run-release-checks.ts --group "$CHECK_GROUP"
      - name: Release check cancellation and owned descendant cleanup
        run: |
          bun bot/scripts/release-check-lifetime-fixture.ts

  release-check:
    name: Release check
    if: ${{ always() }}
    needs: [select-check-groups, check-group]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require every selected group at the same source
        env:
          SELECTION_RESULT: ${{ needs.select-check-groups.result }}
          GROUP_RESULT: ${{ needs.check-group.result }}
          SELECTED_SOURCE: ${{ needs.select-check-groups.outputs.source }}
        shell: bash
        run: |
          # release-check-fan-in-start
          if [[ "$SELECTION_RESULT" != success || "$GROUP_RESULT" != success || -z "$SELECTED_SOURCE" || -z "$GITHUB_SHA" || "$SELECTED_SOURCE" != "$GITHUB_SHA" ]]; then
            echo "Every selected check group must succeed at the requested source." >&2
            exit 1
          fi
          # release-check-fan-in-end
