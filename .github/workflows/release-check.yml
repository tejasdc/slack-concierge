name: Concierge release check

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-check:
    name: Release check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Every fix names its failure record
        run: bun bot/scripts/failure-record-check.ts range origin/main..HEAD
      - name: Install frozen dependencies
        working-directory: bot
        run: bun install --frozen-lockfile
      - name: Select the host GNU timeout dependency
        shell: bash
        run: |
          concierge_timeout=$(command -v gnutimeout || command -v timeout)
          concierge_timeout_version=$("$concierge_timeout" --version)
          printf '%s\n' "$concierge_timeout_version"
          [[ "$concierge_timeout_version" == *"(GNU coreutils)"* ]]
          mkdir -p "$RUNNER_TEMP/concierge-native-bin"
          ln -s "$concierge_timeout" "$RUNNER_TEMP/concierge-native-bin/timeout"
          echo "$RUNNER_TEMP/concierge-native-bin" >> "$GITHUB_PATH"
      - name: Build and check candidate
        working-directory: bot
        env:
          CONCIERGE_STATE_DIR: ${{ runner.temp }}/concierge-release-check
        run: bun run build
      - name: Native history cache backup and crash acceptance
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y restic
          bun bot/scripts/history-cache-maintenance-fixture.ts
          bun bot/scripts/history-cache-crash-fixture.ts
          bun bot/scripts/history-cache-admission-fixture.ts
